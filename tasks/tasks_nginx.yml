#
# Credits: https://raw.githubusercontent.com/StarterSquad/prudentia/develop/prudentia/tasks/nginx.yml
# based on, but refactored and improved.
#

---
- name: Nginx | Check if is present
  ansible.builtin.command: test -x /usr/sbin/nginx
  ignore_errors: true
  register: nginx_present
  changed_when: false
  tags: nginx

- name: Nginx | Install (Alpine Linux)
  when: ansible_os_family == "Alpine"
  block:

    - name: Nginx | Install repository prerequisites (apk)
      community.general.apk:
        update_cache: true
        state: present
        name:
          - openssl
          - curl
          - ca-certificates
      retries: 3
      register: result
      until: result is not failed
      become: true
      tags: nginx

    - name: Nginx | Fetch nginx apk signing key
      ansible.builtin.get_url:
        url: https://nginx.org/keys/nginx_signing.rsa.pub
        dest: /etc/apk/keys/nginx_signing.rsa.pub
        mode: "0644"
      retries: 3
      register: result
      until: result is not failed
      become: true
      tags: nginx

    - name: Nginx | Add nginx.org apk repository
      ansible.builtin.lineinfile:
        path: /etc/apk/repositories
        regexp: "^@nginx https://nginx\\.org/packages/"
        line: "{{ nginx_apk_repo_parts | join('') }}"
        state: present
      become: true
      tags: nginx

    - name: Nginx | Install (apk)
      community.general.apk:
        update_cache: true
        state: "{{ nginx_state }}"
        name: nginx@nginx
      retries: 3
      register: result
      until: result is not failed
      become: true
      tags: nginx
      notify: Nginx | Restart nginx

    - name: Nginx | Install acl (apk)
      community.general.apk:
        state: present
        name: acl
      retries: 3
      register: result
      until: result is not failed
      become: true
      tags: nginx

- name: Nginx | Install (Debian-based systems)
  when: ansible_os_family == "Debian"
  block:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 86400
      when: ansible_os_family == "Debian"
      become: true
      tags: nginx

    - name: Nginx | Get acl dependency (ansible unprivileged user operations magic)
      ansible.builtin.package:
        name: "{{ ['acl', 'libacl1', 'libacl1-dev'] if ansible_distribution == 'Debian' else 'acl' }}"
        state: "present"
      retries: 3
      register: result
      until: result is not failed
      become: true
      tags:
        - nginx

    - name: Nginx | Install GPG (required for apt key management)
      ansible.builtin.package:
        name:
          - gnupg
          - ca-certificates
          - python3-debian
        state: present
      retries: 3
      register: result
      until: result is not failed
      become: true
      tags:
        - nginx

    - name: Nginx | Fetch nginx signing key
      ansible.builtin.get_url:
        url: https://nginx.org/keys/nginx_signing.key
        dest: /tmp/nginx_signing.key
        mode: "0644"
      retries: 3
      register: result
      until: result is not failed
      become: true
      tags:
        - nginx

    - name: Nginx | Dearmor nginx signing key into keyring
      ansible.builtin.command:
        cmd: gpg --dearmor -o /usr/share/keyrings/nginx-archive-keyring.gpg /tmp/nginx_signing.key
        creates: /usr/share/keyrings/nginx-archive-keyring.gpg
      become: true
      tags:
        - nginx

    - name: Nginx | Add nginx.org apt repository
      ansible.builtin.deb822_repository:
        name: nginx
        types:
          - deb
        uris:
          - "https://nginx.org/packages/{{ 'mainline/' if nginx_repo_branch == 'mainline' else '' }}{{ ansible_distribution | lower }}"
        suites:
          - "{{ ansible_distribution_release }}"
        components:
          - nginx
        signed_by: /usr/share/keyrings/nginx-archive-keyring.gpg
        state: present
        enabled: true
      become: true
      tags: nginx

    - name: Nginx | Prefer nginx.org packages over distribution packages
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/99nginx
        content: |
          Package: *
          Pin: origin nginx.org
          Pin: release o=nginx
          Pin-Priority: 900
        mode: "0644"
      become: true
      tags: nginx

    - name: Nginx | Install (apt)
      ansible.builtin.apt:
        update_cache: true
        state: "{{ nginx_state }}"
        name: nginx
      retries: 3
      register: result
      until: result is not failed
      become: true
      tags: nginx
      notify: Nginx | Restart nginx

- name: Nginx | Install (RPM-based systems)
  when: ansible_distribution == 'RedHat' or ansible_distribution == 'CentOS' or ansible_distribution == 'Fedora'
  block:
    - name: Nginx | Get acl dependency (ansible unprivileged user operations magic)
      ansible.builtin.package:
        name: "acl"
        state: "present"
      retries: 3
      register: result
      until: result is not failed
      become: true
      tags:
        - nginx

    - name: Nginx | Add  RPM official nginx key
      ansible.builtin.rpm_key:
        key: https://nginx.org/keys/nginx_signing.key
      retries: 3
      register: result
      until: result is not failed
      when: ansible_distribution == 'RedHat' or ansible_distribution == 'CentOS'
      become: true
      tags: nginx

    - name: Nginx | add YUM official nginx repository
      ansible.builtin.template:
        src: "{{ role_dir }}/templates/nginx/nginx.repo.j2"
        dest: /etc/yum.repos.d/nginx.repo
        mode: "0644"
      when: ansible_distribution == 'RedHat' or ansible_distribution == 'CentOS'
      become: true
      tags: nginx

    - name: Nginx | Install (OS specific yum/dng)
      ansible.builtin.package:
        state: "{{ nginx_state }}"
        name: nginx
      retries: 3
      register: result
      until: result is not failed
      become: true
      tags: nginx
      notify: Nginx | Restart nginx

- name: Nginx | Create sites available/enabled directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  become: true
  tags:
    - nginx


- name: Nginx | Configure include sites-enabled
  ansible.builtin.lineinfile:
    dest: /etc/nginx/nginx.conf
    regexp: ".*sites-enabled.*"
    line: "    include /etc/nginx/sites-enabled/*;"
    insertbefore: "}"
    state: present
  become: true
  tags:
    - nginx

- name: Nginx | Disable default site
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /etc/nginx/default.conf
    - /etc/nginx/conf.d/default.conf
  when: nginx_present is failed
  become: true
  tags:
    - nginx


- name: Nginx | Uncomment server_names_hash_bucket_size
  ansible.builtin.lineinfile:
    dest: /etc/nginx/nginx.conf
    regexp: "^(\\s*)#\\s*server_names_hash_bucket_size"
    line: "\\1server_names_hash_bucket_size 64;"
    backrefs: true
  become: true
  tags:
    - nginx

- name: Nginx | Patch basic settings /etc/nginx/nginx.conf
  ansible.builtin.lineinfile:
    dest: /etc/nginx/nginx.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertbefore: "{{ item.insertbefore | default(omit) }}"
    insertafter: "{{ item.insertafter | default(omit) }}"
    backrefs: "{{ item.backrefs | default(omit) }}"
  with_items: "{{ nginx_conf_properties | default([]) }}"
  become: true
  tags:
    - nginx

- name: Nginx | Create snippets directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - /etc/nginx/snippets
  become: true
  tags:
    - nginx

- name: Nginx | Put default snippets there
  ansible.builtin.copy:
    src: "{{ role_dir }}/files/snippets/{{ item }}"
    dest: "/etc/nginx/snippets/{{ item }}"
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  with_items:
    - fastcgi.conf
    - fastcgi_params
    - uwsgi_params
  become: true
  tags:
    - nginx

- name: Nginx | Add nginx user to additional groups, if needed
  ansible.builtin.user:
    name: 'nginx'
    groups: "{{ item }}"
    append: true
  with_items: "{{ nginx_groups | default([]) }}"
  become: true
  tags:
    - nginx

- name: Nginx | custom log files workaround - allow nginx user to write files into /var/log/nginx but not read
  ansible.posix.acl:
    path: /var/log/nginx
    entity: nginx
    etype: user
    permissions: wx
    state: present
  become: true
  tags:
    - nginx
